name: Deploy to GitHub Pages

on:
  push:
    # The preview branch is here so the site can be looked at before it merges;
    # drop the second pattern once main is the only thing worth publishing.
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still in flight.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository on the first run, so nobody has to
          # visit Settings first. Harmless once it is already enabled.
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          # "/Youth-conclave-2026" for a project page, "/" for a user page —
          # next.config.ts normalises both.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Keep Pages from running the output through Jekyll
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
